<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Apple Notes</title>
<style>body{font:17px -apple-system,system-ui,sans-serif;display:flex;min-height:90vh;align-items:center;justify-content:center;text-align:center;margin:0;padding:24px}
a.btn{display:inline-block;padding:14px 26px;border-radius:12px;background:#f5c518;color:#000;text-decoration:none;font-weight:600}
p{color:#666;font-size:14px}</style></head>
<body><div id="box"><p>Opening Apple Notes…</p></div>
<script>
// Redirect only to Apple Notes notes, nothing else (no open redirect).
(function(){
  var q=new URLSearchParams(location.search);
  var n=q.get('n')||'', o=q.get('o')||'';
  var box=document.getElementById('box');
  if(!/^[0-9A-Fa-f-]{36}$/.test(n) || (o && !/^_[0-9a-f]{32}$/.test(o))){box.innerHTML='<p>Not a valid note link.</p>';return;}
  var url='applenotes:note/'+n+(o?'?ownerIdentifier='+o:'');
  box.innerHTML='<a class="btn" href="'+url+'">Open in Notes</a><p>If Notes didn\u2019t open by itself, tap the button.</p>';
  location.href=url;
})();
</script></body></html>
